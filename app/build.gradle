plugins {
    id 'com.android.application'
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.lilgagatraxx09.traxxion09tunnelpro"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // App metadata
        manifestPlaceholders = [
            appName: rootProject.ext.appName,
            developerName: rootProject.ext.developerName,
            contactEmail: rootProject.ext.contactEmail,
            contactPhone: rootProject.ext.contactPhone,
            location: rootProject.ext.location
        ]
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
    // Enable lint checking
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    
    // Enable aapt options
    aaptOptions {
        cruncherEnabled false
    }
    
    // Enable dex options
    dexOptions {
        javaMaxHeapSize "4g"
        preDexLibraries = false
    }
}

dependencies {
    // AndroidX Core Libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.fragment:fragment:1.6.1'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    
    // Room database (for future use)
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Network operations
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    // File operations
    implementation 'commons-io:commons-io:2.11.0'
    
    // Image loading (for future use)
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}

// Custom task to print app information
task printAppInfo {
    doLast {
        println "=== Traxxion09 Tunnel PRO VPN ==="
        println "App Name: ${rootProject.ext.appName}"
        println "Developer: ${rootProject.ext.developerName}"
        println "Contact: ${rootProject.ext.contactEmail}"
        println "Phone: ${rootProject.ext.contactPhone}"
        println "Location: ${rootProject.ext.location}"
        println "Version: ${rootProject.ext.versionName} (${rootProject.ext.versionCode})"
        println "Package: ${android.defaultConfig.applicationId}"
        println "Min SDK: ${rootProject.ext.minSdkVersion}"
        println "Target SDK: ${rootProject.ext.targetSdkVersion}"
        println "Compile SDK: ${rootProject.ext.compileSdkVersion}"
        println "=================================="
    }
}